interface:
  display_name: "Explain This"
  short_description: "Explain feature flow and actual code execution"
  default_prompt: "Use $explain-this only when explicitly requested. Present the feature overview and semantic processing flow first, then a compact actual execution path, then the detailed explanation of meaningful processing units. Preserve execution order, call nesting, meaningful inline processing, continuation after returns, and termination or response. Explain the units and their roles, conditions, and effects, grounded in the relevant code even across function boundaries or within mixed responsibilities. Distinguish runtime observations, intent, test expectations, and unknowns; stop after the explanation."
policy:
  allow_implicit_invocation: false
