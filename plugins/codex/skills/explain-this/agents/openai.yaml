interface:
  display_name: "Explain This"
  short_description: "Explain implementation flow with grounded limits"
  default_prompt: "Use $explain-this only when explicitly requested. Select major nodes in the requested processing flow and write one short identifier-first contribution statement for each. Match each statement to that unit's actual responsibility. Before returning, remove implementation-internal explanations; preserve essential handoffs, ordering and unknown bridges. Keep extra detail to explicit requests, then stop."
policy:
  allow_implicit_invocation: false
