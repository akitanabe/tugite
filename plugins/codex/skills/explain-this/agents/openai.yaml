interface:
  display_name: "Explain This"
  short_description: "Explain feature flow and actual code execution"
  default_prompt: "Use $explain-this only when explicitly requested. Start with the feature overview and semantic processing flow, display a traceable execution flow with major nodes in actual order and call nesting, meaningful inline steps, continuation after returns, and termination or response. Explain code-grounded meaning, conditions, and effects for meaningful processing units, including mixed responsibilities. Distinguish runtime observations, intent, test expectations, and unknowns; stop after the explanation."
policy:
  allow_implicit_invocation: false
