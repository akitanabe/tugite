interface:
  display_name: "Explain This"
  short_description: "Explain implementation flow with grounded limits"
  default_prompt: "Use $explain-this only when explicitly requested. By default, return a compact processing flow with real implementation identifiers first, briefly stating each unit's contribution and transition within that flow. Use code as evidence and anchors, keeping investigation internal. Add detail only when needed to understand a connection or important behavior, or when requested. Stop after the explanation."
policy:
  allow_implicit_invocation: false
