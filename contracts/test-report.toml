[contracts.test-report-document]
kind = "occurrences"
pattern = "# test-report"
count = 1
paths = [
  "plugins/claude/skills/test-report/SKILL.md",
  "plugins/codex/skills/test-report/SKILL.md",
  "plugins/cursor/skills/test-report/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-trigger-0153196872e1]
kind = "requires"
slice = "test-report-trigger"
pattern = "`test-report` の明示指定、または bounded test scope のテスト群を理解・把握したいことが明確な request で開始します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-responsibility-78022590dfdf]
kind = "requires"
slice = "test-report-responsibility"
pattern = "静的 evidence から Verification Topology を再構成する public Skill です。他 workflow の工程として自動起動しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-ownership-9d9a672d141a]
kind = "requires"
slice = "test-report-ownership"
pattern = "exactly one の task-local Local Model を所有し、scope resolution、static read、input preparation、static interpretation、report projection は同じ Local Model の bounded projection を利用します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-agentic-first-d5c89556f797]
kind = "requires"
slice = "test-report-agentic-first"
pattern = "Agentic Model Construction を first route とし、repository / source の静的観測、scope resolution、Behavior / Context candidate と provenance の acquisition scope を Agent-side で先に決めます。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-local-confirmation-48dd7d3bcc1d]
kind = "requires"
slice = "test-report-local-confirmation"
pattern = '''残る material gap の fact、scope intent、authority、または部分観測で継続する判断が Human-owned の場合だけ、`test-report` が caller-side で
局所確認し、response を同じ Local Model へ Reintegration します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-limitation-boundary-14d9c2d3ae3d]
kind = "requires"
slice = "test-report-limitation-boundary"
pattern = '''Human-owned でない evidence limitation、取得不能な source、execution capability の不足、または単なる Agent の不確かさは Human の選択で
埋めず、current understanding、試した解消経路、limitation、qualification を返して停止します。局所 response により scope / write authority を
広げません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-acquisition-scope-4c6040e1623f]
kind = "requires"
slice = "test-report-acquisition-scope"
pattern = '''これは取得範囲の決定であり、Behavior grounding や
authority を持つ Context 間の semantic precedence の解決ではありません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-completeness-9450a11ecf5c]
kind = "requires"
slice = "test-report-completeness"
pattern = "completeness Calculation は resolved set と observed set の一覧差から判定し、resolved membership とその basis を report の traceability まで保持します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-zero-tests-4773285011e7]
kind = "requires"
slice = "test-report-zero-tests"
pattern = "解決済み test scope が zero tests であることは有効な観測結果であり、scope 自体を解決できない結果と区別して報告します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-topology-input-f722cdcae0ec]
kind = "requires"
slice = "test-report-topology-input"
pattern = '''Behavior candidate、authority を持ち得る Context、Case / Evidence / config facts、resolved / observed membership と completeness basis、各 provenance / source location を
consumer input として準備します。対象 test は discovery signal、Case、Evidence、scope fact としてだけ渡します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-candidate-preservation-4d641dd018af]
kind = "requires"
slice = "test-report-candidate-preservation"
pattern = "acquisition scope 内で観測した Behavior / Context candidate は semantic authority の採否を決めず、provenance と適用範囲を失わずに渡します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-topology-method-068013a5153d]
kind = "requires"
slice = "test-report-topology-method"
pattern = "準備した consumer input を `Verification Topology` Method に渡し、返された Topology Data を同じ Local Model へ reintegrate します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-static-boundary-634298f39a09]
kind = "requires"
slice = "test-report-static-boundary"
pattern = "test、target code、source、CI を実行せず、quality verdict、coverage verdict、severity、remediation、planning、implementation、後続 Action を開始しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-output-8b18af9fc6fa]
kind = "requires"
slice = "test-report-output"
pattern = "observed scope、Topology、Behavior、Expected Observation、Case、Evidence、execution state、unresolved correspondence、scope-relative absence、BMO derivation limits を含む Observation Limits、source / config traceability を、request に適応した report へ投影します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-human-facing-b0dbb1dd1bc0]
kind = "requires"
slice = "test-report-human-facing-projection"
pattern = '''observed scope、Topology、Observation Limits、evidence traceability と retained qualification を含む report candidate の内容・構成・tone を確定した後、one-shot response の返却または明示された destination への artifact write の前に、`../../references/human-facing-projection.md` の Final output boundary に従って report 全体の Human 向け prose へ適用します。scope、静的観測の範囲、未実行・未確認・対応未解決・absence の区別、relation、state、limits、source location の意味と caller の write authority は `test-report` が保持します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-human-facing-projection-70956d587141]
kind = "requires"
slice = "test-report-human-facing-projection-verification"
pattern = "共通の Final output boundary に従う report の出力前確認では、observed evidence、scope、qualification、traceability を保ち、test、source、CI の実行、品質評価、remediation を開始しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-write-boundary-f2ebde0dd435]
kind = "requires"
slice = "test-report-write-boundary"
pattern = "明示された destination と write authority がある場合だけ report artifact をその範囲へ書きます。report のために source、test、config、無関係 artifact を変更しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-default-output-72d411d412a3]
kind = "requires"
slice = "test-report-default-output"
pattern = "既定では one-shot response を返します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-codex-invocation-policy]
kind = "occurrences"
pattern = "allow_implicit_invocation: true"
count = 1
paths = ["plugins/codex/skills/test-report/agents/openai.yaml"]
applies_to = ["codex"]
