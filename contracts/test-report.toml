[contracts.test-report-document]
kind = "occurrences"
pattern = "# test-report"
count = 1
paths = [
  "plugins/claude/skills/test-report/SKILL.md",
  "plugins/codex/skills/test-report/SKILL.md",
  "plugins/cursor/skills/test-report/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-trigger-0153196872e1]
kind = "requires"
slice = "test-report-trigger"
pattern = '''`test-report` の明示指定、または bounded test scope のテスト群を理解・把握したいことが明確な request で開始します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-responsibility-19c739a6ff62]
kind = "requires"
slice = "test-report-responsibility"
pattern = '''指定範囲のテスト群について、全体像、振る舞い別詳細、根拠付きの静的診断、未確定事項を提示する public Skill です。検証・修復する対象の判断を支え、実行と修復は明示起動された `test-verify` が所有します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-ownership-ab7ed5c38622]
kind = "requires"
slice = "test-report-ownership"
pattern = '''一回の invocation に対して exactly one の task-local Local Model を所有し、scope resolution、static read、Topology input、static diagnosis、report projection に同じ Model を利用します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-agentic-first-c4e8af85eaf2]
kind = "requires"
slice = "test-report-agentic-first"
pattern = '''Agentic Model Construction を first route とし、repository / source の静的観測から bounded scope、要求・Context、test / target-code membership、runner / config の acquisition scope と根拠を Agent-side で先に決めます。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-local-confirmation-bcc918088dc5]
kind = "requires"
slice = "test-report-local-confirmation"
pattern = '''bounded な分解・再観測後に残る material gap の fact、scope intent、authority、または部分観測で継続する判断が Human-owned の場合だけ局所確認し、response を同じ Local Model へ reintegrate します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-limitation-boundary-d29f67ff78be]
kind = "requires"
slice = "test-report-limitation-boundary"
pattern = '''Human-owned でない取得不能や不確かさは Human の選択で埋めず、試した解消経路と limitation を保持します。方向・範囲・意味を確定できなければ qualified な部分報告で停止します。確認によって scope / write authority を暗黙に広げません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-acquisition-scope-ac2206b9c192]
kind = "requires"
slice = "test-report-acquisition-scope"
pattern = '''resolved-scope Data は bounded test membership、target-code units、要求・Context の read scope、必要な observation surface と根拠を保持します。これは取得範囲の決定であり、Behavior grounding や semantic precedence の最終解決ではありません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-completeness-418aafc80861]
kind = "requires"
slice = "test-report-completeness"
pattern = '''resolved set と observed set の一覧差から completeness を判定し、両 membership と根拠を出力まで保持します。未読 member は再観測を試し、残れば明示します。未読を含む scope の absence を主張しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-zero-tests-34a8eb2ad056]
kind = "requires"
slice = "test-report-zero-tests"
pattern = '''解決済み test scope が zero tests である結果と、scope 自体を解決できない結果を区別します。zero tests でも要求側の候補と観測限界を保持します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-requirement-derived-candidates-a5f50e100fb1]
kind = "requires"
slice = "test-report-requirement-derived-candidates"
pattern = '''要求・仕様と authoritative Context の意味からも Behavior candidate を構成し、既存 test に現れる振る舞いだけを母集団にしません。対象 test は discovery signal、Case、Evidence、scope fact とし、自身の Behavior / Expected Observation の正当性の根拠にはしません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-topology-input-284b01508881]
kind = "requires"
slice = "test-report-topology-input"
pattern = '''Behavior / Context candidate、provenance と適用範囲、Case / Evidence / config facts、resolved / observed membership と completeness basis、source location を consumer input として準備します。要求側の未解決点と test-only candidate も失わずに渡します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-topology-method-f0250f7508fc]
kind = "requires"
slice = "test-report-topology-method"
pattern = '''consumer input を唯一の grounding・対応関係の正本である `Verification Topology` Method に渡し、Topology Data を同じ Local Model へ reintegrate します。grounding、precedence、Expected Observation、correspondence、execution state、absence の意味を変更しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-diagnosis-b4e0fe9fed4b]
kind = "requires"
slice = "test-report-diagnosis"
pattern = '''Topology と観測した要求・test・source・config の根拠を照合し、静的に確認できた問題、実行確認が必要な疑い、判断材料の不足を区別します。各指摘に選択用の識別子、確認状態、根拠と location、見逃しうる問題、次に確認する点を残します。診断は `references/observation-and-diagnosis.md` に従い、静的診断を runtime 実証として扱いません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-static-boundary-268fc17a74f5]
kind = "requires"
slice = "test-report-static-boundary"
pattern = '''test、target code、source、CI を実行せず、source / test / config の修正や remediation、`test-verify` への自動遷移を行いません。次に確認する点の提示は実行・修復の許可ではありません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-full-scope-details-f01a770372a0]
kind = "requires"
slice = "test-report-full-scope-details"
pattern = '''概要だけで終了せず、問題のない箇所も含む observed scope 全体の Behavior → Expected Observation ↔ Case → Evidence を辿れる詳細を提示します。正常・境界・異常の観測された条件、実際の assertion、source location、未対応 Evidence、要求側の evidence gap、観測限界を保持します。優先度は表示順に使い、詳細を省く理由にしません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-case-relation-preservation-3411721fd1df]
kind = "requires"
slice = "test-report-case-relation-preservation"
pattern = '''Case の意味的シナリオ単位と Expected Observation ↔ Case の many-to-many relation を保持し、function / file 単位に平坦化しません。framework、runner、suite、test level は scope と traceability の補助情報です。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-output-dcbab2e32471]
kind = "requires"
slice = "test-report-output"
pattern = '''観測した repository / ref、resolved / observed scope、要求根拠、Behavior、Expected Observation、Case / Evidence の参照先、execution state、対応不明、scope-relative absence、導出・grounding・観測限界と診断を出力します。未読、未実行、skip、対応不明、証拠なしは別の状態として残します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-handoff-68a9b4e09e27]
kind = "requires"
slice = "test-report-handoff"
pattern = '''report 全体または識別子で選択した指摘を、Human が `test-verify` の入力にできます。report は事前実行の必須要件ではなく、直接の bounded target も verify の入口です。引き継ぎはこの report と参照先で足り、専用台帳や巨大な中間成果物を要求しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-human-facing-projection-63390b7ee78c]
kind = "requires"
slice = "test-report-human-facing-projection"
pattern = '''report candidate を確定後、`../../references/human-facing-projection.md` の Final output boundary を適用します。observed scope 全体の詳細、診断の確認状態、qualification、relation、source location と write authority を保持して出力前に確認します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-write-boundary-f2ebde0dd435]
kind = "requires"
slice = "test-report-write-boundary"
pattern = '''明示された destination と write authority がある場合だけ report artifact をその範囲へ書きます。report のために source、test、config、無関係 artifact を変更しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-default-output-72d411d412a3]
kind = "requires"
slice = "test-report-default-output"
pattern = '''既定では one-shot response を返します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-codex-invocation-policy]
kind = "occurrences"
pattern = "allow_implicit_invocation: true"
count = 1
paths = ["plugins/codex/skills/test-report/agents/openai.yaml"]
applies_to = ["codex"]

[contracts.test-report-counterexamples-27408eeffd78]
kind = "requires"
slice = "test-report-counterexamples"
pattern = '''要求違反なのに成功する見逃しと、要求を満たす正当変種なのに失敗する誤拒否を、具体的な入力・変更・assertion の反例で探索します。要求・公開契約・互換性・非機能要求・authoritative Context の provenance / 適用範囲、成立条件、counterevidence、未確認事項を保持し、表面的な Test Smells や要求への非明記だけでは finding にしません。反例診断と品質判断はこの consumer が所有し、Verification Topology へ移しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-counterexample-grounding-f1c88dd96f13]
kind = "requires"
slice = "test-report-counterexample-grounding"
pattern = '''見逃し（false negative）は、要求に違反する具体的な入力・実装変更でも対象 assertion が成功する条件を探します。誤拒否（false positive）は、独立した要求・契約を満たす具体的な変更でも対象 assertion が失敗する条件を探します。対象 test 自身の期待値や現実装だけから変種の正当性を導出しません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-counterexample-finding-550483c996a7]
kind = "requires"
slice = "test-report-counterexample-finding"
pattern = '''各反例 finding は、要求・契約 / Expected Observation の根拠と所在、存在する Case / Evidence と test / source / config location、具体的な入力・変更・assertion、成立条件、見逃す違反または誤拒否する正当変種、counterevidence、確認状態、未確認事項、次の検証点を保持します。静的に確認できた問題、実行確認が必要な疑い、判断材料不足を区別し、反例未発見を品質保証にしません。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.test-report-missing-evidence-finding-2d8011868ef1]
kind = "requires"
slice = "test-report-missing-evidence-finding"
pattern = '''対応 Case / Evidence がない欠落は架空の Case / Evidence で埋めず、要求 / Expected Observation の根拠と所在、absence を判断した bounded observed scope と completeness basis、対応 Evidence が観測されなかった事実を残します。未読、未実行、対応不明を absence に変換しません。'''
applies_to = ["claude", "codex", "cursor"]
