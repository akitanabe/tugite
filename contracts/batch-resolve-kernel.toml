[contracts.batch-resolve-kernel-distribution]
kind = "occurrences"
pattern = "# Batch Resolve Kernel v1"
paths = [
  "plugins/claude/references/batch-resolve-kernel.md",
  "plugins/codex/references/batch-resolve-kernel.md",
]
count = 1
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-mention-allowlist]
kind = "forbids"
pattern = "batch-resolve-kernel"
exclude_paths = [
  "plugins/claude/references/batch-resolve-kernel.md",
  "plugins/codex/references/batch-resolve-kernel.md",
]
applies_to = ["claude", "codex", "claude-marketplace", "codex-marketplace"]

[contracts.batch-resolve-kernel-requires-c151425c26b4]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''Kernel identity: `batch-resolve-kernel-v1`.
Kernel dependencies: `none`.'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-9a0c2283058a]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''この Kernel の適用可能性は caller 名ではなく、counterpart model と snapshot coherence で決める。一つの
Resolution Batch の全 Resolution Point が同じ origin verified snapshot を観測して生成済みで、counterpart
observation が Resolution Transaction の外側で完了し、その判断が non-binding Data であり、resolver が
caller-owned authority に従って各 point を裁定でき、transaction 中に counterpart が更新後 snapshot を再観測しない
場合に適用できる。counterpart の判断が binding である場合、または point が snapshot 更新後に逐次観測される場合は
適用しない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-8bf1d3662dac]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''`Resolution Batch` は、一つの origin verified snapshot に束縛され、Resolution Transaction の開始時までに観測済みの
Resolution Point の固定集合である。transaction 中に membership を増やさず、snapshot 更新後も再計算せず、異なる
origin snapshot の point を混ぜない。空 Batch は有効だが、workflow completion を意味しない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-fa405f846f02]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''`Resolution Point` は、caller が Resolution Transaction で裁定対象として供給する個々の論点である。finding、insight、
suggestion などの caller 固有語彙は caller が point へ mapping し、Kernel は point schema や ID を新設しない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-245723105815]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''`Resolution Transaction` は、一つの Resolution Batch を adjudication から verified snapshot promotion または caller
boundary への返却まで扱う規範上の実行単位である。DB-style ACID transaction や batch 全体の rollback を意味せず、
atomic promotion boundary は partition とする。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-8d7ed3234ce3]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''`working state` は、一つの selected partition を current verified snapshot へ apply している未検証状態である。verify
前に current verified snapshot へ昇格させず、partition ごとに閉じ、未検証状態の上へ次 partition を積まない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-60ee65193247]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''mutation 前に Resolution Batch 全体を裁定する純粋な Calculation とし、adjudication 中に artifact または working state を
変更しない。origin verified snapshot と transaction 開始時の caller-supplied evidence を固定 baseline として、conflict
と dependency を Batch 全体で確認する。両立不能な point を同時に selected set へ残さず、apply 開始前に全 point を
裁定済み、または caller-owned boundary へ返す対象として確定する。未裁定 point を残したまま apply へ進まない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-33e2ba0d5671]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''`selected set` は、caller-owned disposition のうち apply 対象となる point の transaction-local な一時集合であり、public
verdict や ledger field ではない。authority または evidence が不足する point を推測で含めない。空なら mutation せず
transaction を閉じられるが、workflow completion ではない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-8bbd6e1f2b66]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''default は single partition とする。partition は execution と verification の boundary であり conflict 解決手段ではなく、
point 数や編集量だけでは分割しない。中間 verified snapshot が必要な dependency、分離しなければ安全に確認できない
verification boundary、verify failure 後の isolate を主な分割理由とする。各 partition は単独で
`verify + semantic progress + promote` しても意味的に成立する independently promotable boundary でなければならない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-fee37e0a8fd9]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''verify success に加えて selected obligation に対する semantic progress を確認した場合だけ working state を current
verified snapshot へ promote する。diff があることだけを progress とせず、progress criteria は caller-owned とする。
no-progress の working state は昇格させず、同じ state、evidence、decision の表現だけを変えた retry を繰り返さない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-4d2b4eb75364]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''2つ目以降の partition は origin verified snapshot 上で裁定済みだが、更新済み current verified snapshot 上で apply
されるため、apply 前に `applicability check` を行う。adjudication や counterpart の判断を再実行せず、latent issue を
探索せず、前 partition の promotion によって selected obligation が既に充足されたか、成立前提が失われたか、新たな
conflict が成立したか、dependency condition が維持されているかだけを確認する。適用不能の evidence は corrective
adjudication に利用できる。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-760409d8c6d9]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''成功済み partition は rollback しない。後続 partition の成功がなければ成立しない変更は同じ partition に入れる。
後から先行 partition 単独では成立しないと判明した場合、partition または verification boundary の不備として
caller-owned incomplete / unresolved へ返す。Kernel は transaction-wide rollback protocol を持たない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-bf25f17cf36c]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''isolate は diagnostic operation である。全 subset の diagnostic apply と verify は、failing partition が失敗する直前の
current verified snapshot を同一の isolation baseline として開始し、diagnostic working state を昇格しない。isolation 後に
caller-owned adjudication を確定し、残った selected subset は通常の `apply → verify → semantic progress → promote` で
改めて処理する。安全に進められなければ caller-owned boundary へ返し、Kernel は isolate retry count や budget を持たない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-3606e2dfbd4e]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''verify failure では、failing partition を failure を局所化できるより小さい非空 subset へ `isolate` する。二分固定にせず、
resolver が conflict、dependency、verification boundary などから分割戦略を選ぶ。未検証の partition を前進させず、単一
culprit point の特定や mathematically global minimum の探索を保証しない。point interaction が原因なら failing subset
を failing unit として扱い、caller-owned execution bound 内で安全にこれ以上縮小できない subset まで局所化する。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-ac7ed077a750]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''通常の adjudication は mutation 前に一度だけ行う。ただし apply、verify、isolate、applicability check から transaction
内で新しい execution evidence が得られた場合に限り、元の Resolution Batch 内の point への corrective adjudication を
許す。新 evidence により caller-owned disposition を再確定できるが、元 Batch の membership 外に新しい Resolution
Point を追加せず、counterpart を再起動しない。selected set が変われば残りを改めて partition し、安全に裁定できなければ
caller-owned boundary へ返す。new evidence may revise old points, but may not create a new frontier.'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-c8d0ffc9e2bf]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''transaction 開始時の adjudication baseline は origin verified snapshot、caller-supplied evidence、origin-bound Resolution
Batch の組として固定し、adjudicate 中に外部情報を再取得して暗黙更新しない。transaction 内で verify、isolate、
applicability check が生成した evidence だけを corrective adjudication に利用できる。transaction 外から新しい evidence が
入った場合は途中へ混ぜず caller boundary へ返し、必要なら caller が新しい Resolution Transaction を起動する。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-8fd07c7ece81]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''caller は invocation boundary、resolver と counterpart の mapping、authority、execution bound、verification criteria、
