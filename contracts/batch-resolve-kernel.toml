前に role、authority、snapshot、return boundary が既存責務へ mapping されていなければ推測しない。'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-requires-f59a16ec7149]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''authority が不足する point を selected set に入れず、その point から独立して安全に処理できる他 point は自動停止
