[contracts.batch-resolve-kernel-distribution]
kind = "occurrences"
pattern = "# Batch Resolve Kernel v1"
paths = [
  "plugins/claude/references/batch-resolve-kernel.md",
  "plugins/codex/references/batch-resolve-kernel.md",
]
count = 1
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-mention-allowlist]
kind = "forbids"
pattern = "batch-resolve-kernel"
exclude_paths = [
  "plugins/claude/references/batch-resolve-kernel.md",
  "plugins/codex/references/batch-resolve-kernel.md",
  "plugins/claude/skills/proposal/SKILL.md",
  "plugins/claude/skills/plan-craft/SKILL.md",
  "plugins/claude/skills/review-loop/SKILL.md",
  "plugins/claude/skills/impl-lead/SKILL.md",
  "plugins/codex/skills/proposal/SKILL.md",
  "plugins/codex/skills/plan-craft/SKILL.md",
  "plugins/codex/skills/review-loop/SKILL.md",
  "plugins/codex/skills/impl-lead/SKILL.md",
]
applies_to = ["claude", "codex", "claude-marketplace", "codex-marketplace"]

[contracts.batch-resolve-kernel-requires-c151425c26b4]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''Kernel identity: `batch-resolve-kernel-v1`.
Kernel dependencies: `none`.'''
applies_to = ["claude", "codex"]

# Why Not: caller and Kernel ownership fields are one declaration boundary; splitting them would allow cross-section false greens.
[contracts.batch-resolve-ownership-data-fc45b9ecc23c]
kind = "requires"
slice = "batch-resolve-kernel-v1"
pattern = '''caller_owns = ["invocation boundary", "resolver/counterpart mapping", "authority", "execution bound", "verification criteria", "existing verdict/ledger/return vocabulary", "workflow completion"]
kernel_does_not_own = ["caller-specific point/ledger schema", "workflow status/public parameter/retry/round orchestration"]'''
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-forbids-84b8683e1d88]
kind = "forbids"
slice = "batch-resolve-kernel-v1"
pattern = "`resolve-kernel-v1`"
applies_to = ["claude", "codex"]

[contracts.batch-resolve-kernel-forbids-b86f12c3c035]
kind = "forbids"
slice = "batch-resolve-kernel-v1"
pattern = "`necessity-kernel-v1`"
applies_to = ["claude", "codex"]
