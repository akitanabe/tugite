after = "find-way-flow-step-3"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-step-3-before-step-4]
kind = "order"
before = "find-way-flow-step-3"
after = "find-way-flow-step-4"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-step-4-before-step-5]
kind = "order"
