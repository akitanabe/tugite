[contracts.find-way-document]
kind = "occurrences"
pattern = "# find-way"
count = 1
paths = [
  "plugins/claude/skills/find-way/SKILL.md",
  "plugins/codex/skills/find-way/SKILL.md",
  "plugins/cursor/skills/find-way/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-claude-cursor-invocation-policy]
kind = "occurrences"
pattern = "disable-model-invocation: true"
count = 1
paths = [
  "plugins/claude/skills/find-way/SKILL.md",
  "plugins/cursor/skills/find-way/SKILL.md",
]
applies_to = ["claude", "cursor"]

[contracts.find-way-codex-invocation-policy]
kind = "occurrences"
pattern = "allow_implicit_invocation: false"
count = 1
paths = ["plugins/codex/skills/find-way/agents/openai.yaml"]
applies_to = ["codex"]

[contracts.find-way-explicit-only-0c9b49cbd47b]
kind = "requires"
slice = "find-way-explicit-only"
pattern = "`find-way` は Human が明示した場合だけ開始する public pre-planning workflow です。request の Destination 全体にある Planning Fog と planning 前の Decision blocker を解像し、1..N の self-contained な Work Units を返します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-non-goals-aff00efca1af]
kind = "requires"
slice = "find-way-non-goals"
pattern = "`find-way` は plan、plan review、implementation、production work、deliverable completion、complete 後の reopen、または特定 downstream workflow への routing / auto-transition を開始しません。他 workflow は `find-way` を推奨できますが、暗黙起動しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-destination-selection-3f1b0b52c32e]
kind = "requires"
slice = "find-way-destination-selection"
pattern = "新規 invocation では caller / harness が観測した candidate facts と requested destination を shared Destination Selection へ渡し、返された selection result を変更せず、selected destination は state lifecycle に、unresolved gap / incomplete は workflow result に使用します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-local-model-dfcd8e5af4cd]
kind = "requires"
slice = "find-way-local-model"
pattern = "一回の invocation は Destination 全体を semantic subject とする exactly one の task-local Local Model を所有します。Agentic Model Construction を first route とし、Human-owned blocker が残り、Agent-side で独立した semantic progress route がない場合だけ Interactive Model Construction を同じ Local Model へ composition します。Decision Unit、Research Agent、nested consumer は別 Local Model を持ちません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-map-d843906938c9]
kind = "requires"
slice = "find-way-map"
pattern = "初期観測は breadth-first に主要 uncertainty / decision boundary を横断し、Destination、Work Units、Decision Units、Planning Fog、Out of scope からなる low-resolution current-state Map を構成します。Map は index であり、detail、推論履歴、append-only history を重複保持しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-decision-unit-2d5b32240f05]
kind = "requires"
slice = "find-way-decision-unit"
pattern = "sharp かつ bounded な question だけを Decision Unit とし、canonical state は `open | resolved` だけとします。`actionable | blocked` は open state と material dependency の resolved / unresolved から導出し、第三の canonical state にしません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-resolution-boundary-d95e89793f2c]
kind = "requires"
slice = "find-way-resolution-boundary"
pattern = "bounded conclusion により question の残部を一つの成立済み WU 内の downstream planning 責務へ局所化できた場合は Decision Unit を resolved にし、material unresolved matter をその WU の `remaining gap` または `established context` へ一度だけ投影します。WU boundary が未形成の Planning Fog は remaining gap へ移しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-reintegration-86f142cde212]
kind = "requires"
slice = "find-way-reintegration"
pattern = "resolution は same Local Model へ Reintegration し、material invalidation がある場合だけ affected region を Recomposition します。Map は current evidence に合わせ、Fog の縮小、Decision Unit の形成 / 解消、WU の形成 / split / merge / boundary adjustment、Out of scope の更新を stale state への追記ではなく置換として反映します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-work-unit-18227355e777]
kind = "requires"
slice = "find-way-work-unit"
pattern = "各 Work Unit は fresh downstream workflow が Map を読み直さず、他 WU の planning を同時に抱えず扱える self-contained な planning context とします。Data は id、name、scope、`planning-bounded | planning-ready`、established context、planning-bounded 時の remaining gap、material dependencies を持ちます。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-work-unit-readiness-98d3d66487d1]
kind = "requires"
slice = "find-way-work-unit"
pattern = "`planning-bounded` は WU boundary は成立しているが planning 開始前に material な理解不足が残り、additional refinement が扱う `remaining gap` があることを表します。`planning-ready` は additional premise construction なしに planning へ進める状態であり、planning 内で扱う trade-off や選択が残らないことを意味しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-persistence-a44a929da4df]
kind = "requires"
slice = "find-way-persistence"
pattern = "保存と read-back に成功した場合だけ、destination と same state identity を再解決できる `resume_reference` を `incomplete` result の外部へ明示的に返します。reference は Human-visible または caller-held Data とし、state object 内だけに閉じません。write / read-back failure は partial / unknown state と evidence を伴う `incomplete` とし、広域 scan、silent discovery、relocation / migration を resume 前提にしません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-completion-disposition-7c8eef625ee6]
kind = "requires"
slice = "find-way-completion-disposition"
pattern = "`resume_reference` から再開した persisted unfinished state について `complete` を返す前に、exact state と `resume_reference` が再開可能な unfinished state として残らない disposition を確定します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-6f580e09b781]
kind = "requires"
slice = "find-way-flow"
pattern = "Trigger: 親 `find-way` が current Map の semantic judgment と completion facts を確定した。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-inputs-58b9c61f1d89]
kind = "requires"
slice = "find-way-flow"
pattern = "Inputs: Destination coverage、WU count / readiness、Planning Fog の有無、active open Decision Unit の有無、Agent-side progress route の有無、Human-owned blocker の有無、persistence eligibility、resumed persisted unfinished state / resume_reference の有無、completion-time disposition authority / eligibility。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-complete-f3e05751aad4]
kind = "requires"
slice = "find-way-flow"
pattern = "1. Destination coverage が 1..N WU で成立し、Planning Fog と active open Decision Unit がない completion invariant を評価する。planning-bounded WU は成立を妨げない。成立時は `disposition not required → complete / WU boundary freeze`、`disposition required + authority / eligibility established → shared External Effects boundary の下で completion-time disposition Action → result Data → exact state / resume_reference の independent verification`、`disposition required + authority / eligibility absent | unknown → evidence 付き incomplete` とし、Action branch は `verified non-resumable → complete / freeze`、`failure | unknown → evidence 付き incomplete` に投影する。未成立時は形成済み WU を provisional として step 2 へ進む。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-continue-0ecc2c6a81e7]
kind = "requires"
slice = "find-way-flow"
pattern = "2. それ以外で Agent-side progress route があれば、same invocation / same Local Model で semantic judgment へ戻る。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-interactive-c1799283bf84]
kind = "requires"
slice = "find-way-flow"
pattern = "3. 進行 route がなく Human-owned blocker があれば、同じ Local Model に Interactive Model Construction を composition する。gap が解消された result は same Local Model へ Reintegration して same invocation の semantic judgment へ戻し、未解消 result は limitation / evidence 付き `incomplete` へ投影する。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-persistence-e19702c9fe16]
kind = "requires"
slice = "find-way-flow"
pattern = "4. それ以外は persistence eligibility に従う。`eligible` は shared External Effects boundary に従って state create / update / read-back Action を実行し、その後に result Data を得る。`ineligible` は保存せず evidence 付き `incomplete` とする。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-action-result-ec126deced5c]
kind = "requires"
slice = "find-way-flow"
pattern = "5. `eligible` branch で Action 後に得た result Data を `success → resume_reference を伴う incomplete`、`failure | unknown → evidence 付き incomplete` に投影する。`ineligible` branch は step 4 の `incomplete` をそのまま返し、Action result Data を要求しない。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-public-results-a4e319d81431]
kind = "requires"
slice = "find-way-flow"
pattern = "Flow が terminal に返す public result は `complete | incomplete` とします。step 2 と gap 解消済みの step 3 は terminal result を作らず、親の autonomous semantic judgment へ戻ります。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-complete-outcome-72396289fd2b]
kind = "requires"
slice = "find-way-flow"
pattern = "- `complete`: required な completion-time disposition の independent verification を通過したうえで、freeze した stable Work Units を返す。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-incomplete-outcome-37863a987563]
kind = "requires"
slice = "find-way-flow"
pattern = "- `incomplete`: completion invariant 未成立時の provisional Work Units、current limitation、persistence / disposition result を返し、unfinished state の保存成功時だけ externally returned `resume_reference` を含める。"
applies_to = ["claude", "codex", "cursor"]

[contracts.find-way-flow-trigger-before-inputs]
kind = "order"
before = "find-way-flow-trigger"
after = "find-way-flow-inputs"
applies_to = ["claude", "codex", "cursor"]

