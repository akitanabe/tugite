[contracts.clarify-it-casebook-18220e74abcb]
kind = "requires"
slice = "clarify-it-casebook"
pattern = '''- 複数案がある: 技術的根拠で優劣を導けるなら Agent が推奨を導き、案の数だけで Human に聞かない。
- Agent が知らない: 調査可能な不足を価値判断へ変換せず、まず調べる。
- 判断が強く結合する: 別々に答えると矛盾する判断は一つの decision context にまとめる。
- 上位概念が変わる: 新しい目的で古い分解が無効になれば、古い queue を捨てて再構成する。
- 根拠が変わる: 新しい evidence で優劣が変われば推奨を更新する。
- 過去判断と現在が衝突する: 過去判断を自動継承せず、現在の根拠で再評価する。
- 大規模な再構成: 意味ある全体像を作る前に早期圧縮せず、依存を捉えてから Human Decision Point を選ぶ。
- 正しいが細かすぎる質問: 局所的に正しくても対話全体を過剰詳細化するなら、一段上から再圧縮する。
- 短い `ok`: 対象 context が一意なら統合し、一意でなければ確認する。
- 最終結果: 対話履歴の列ではなく、現在の一貫した意思決定モデルを返す。'''
applies_to = ["claude", "codex", "cursor"]

