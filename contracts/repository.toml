[contracts.plan-artifact-publication-reference-identity]
kind = "occurrences"
pattern = "Publication reference identity: `plan-artifact-publication-v1`."
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-data]
kind = "occurrences"
pattern = '''publication_target = {
  exact_destination,
  exact_filename,
  finite_retry_bound,
  qualification_evidence,
  destination_state = one of {
    existing_destination_object_identity,
    os_temp_creation = {
      verified_temp_root_identity,
      exclusive_creation_intent
    }
  }
}'''
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-os-temp-exact-destination]
kind = "occurrences"
pattern = "OS-temp では top-level `exact_destination` が作成予定の run-owned directory path であり、verified temp-root 直下への canonical containment を満たす。"
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-no-nested-destination]
kind = "forbids"
pattern = "exact_run_owned_directory_path"
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-procedure]
kind = "occurrences"
pattern = "既存 destination では資格と観測済み destination object identity を再確認する。OS-temp では verified temp-root identity と top-level exact destination の root 直下 containment を再確認し、exact destination の directory を same-filesystem の secure / exclusive / non-follow で作成して、その object identity を記録する。directory 作成後、staging 作成前に、資格と destination object identity を再確認する。"
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-security]
kind = "occurrences"
pattern = "canonical containment、symlink / junction non-follow、ignored / index qualification、no-clobber、exact ownership identity cleanup"
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-artifact-publication-reference-no-clobber]
kind = "occurrences"
pattern = "complete のときだけ no-clobber publish を行い"
count = 1
paths = [
  "plugins/claude/references/plan-artifact-publication.md",
  "plugins/codex/references/plan-artifact-publication.md",
  "plugins/cursor/references/plan-artifact-publication.md",
