[contracts.no-kernel-handoff-field]
kind = "forbids"
pattern = "_handoff"
applies_to = ["claude", "codex", "cursor"]

[contracts.no-kernel-verdict-field]
kind = "forbids"
pattern = "necessity_verdict"
applies_to = ["claude", "codex", "cursor"]

[contracts.no-kernel-status-field]
kind = "forbids"
pattern = "necessity_status"
applies_to = ["claude", "codex", "cursor"]

[contracts.no-kernel-decision-field]
kind = "forbids"
pattern = "necessity_decision"
applies_to = ["claude", "codex", "cursor"]

[contracts.no-kernel-field-field]
kind = "forbids"
pattern = "necessity_field"
applies_to = ["claude", "codex", "cursor"]

[contracts.no-kernel-result-field]
kind = "forbids"
pattern = "necessity_result"
applies_to = ["claude", "codex", "cursor"]

# Why Not: keep ownership, evidence, and acceptance prohibitions in one coherent declaration; splitting them could permit cross-section false greens.
[contracts.repository-test-qa-baseline-a0b98d2f7393]
kind = "requires"
slice = "repository-test-qa-baseline"
pattern = '''policy_id = "test-qa-baseline-v1"
test_artifacts = ["automated test", "Gunte predicate/contract", "fixture/oracle", "EVAL"]
qa_inputs = ["Task Spec", "base", "acceptance criteria", "diff", "evidence", "surrounding context"]
common_evidence = ["evidence identity is fixed within each input variant", "parent oracle is common across input variants"]
owner = "parent QA"
routes = ["impl-lead", "non-impl-lead"]
baseline_self_qa = "required on every route"
reviewer = "optional additional observation"
reviewer_handoff = "pass baseline and reason in existing context; parent adjudicates findings"
parent_responsibility = "obligation, oracle, validation plane, final adjudication"
reviewer_scope = "changed mutation, structural test, EVAL case quality only"
gunte_antipattern_url = "https://github.com/akitanabe/gunte/blob/main/docs/gunte-antipatterns.md"
gunte_antipattern_url_use = "provenance only; runtime retrieval is not required"
minimum_checks = [
  "obligation/oracle owner = parent QA",
  "appropriate validation plane is explicit",
  "do not infer semantics from prose layout",
  "reject empty or overbroad slice, decoy, custom parser, and duplicate Gunte guarantee",
  "applicable mutation evidence is present",
]
accept_prohibition = [
  "reviewer Pass is never an accept basis",
  "reviewer observation is additive and never replaces baseline self-QA",
  "missing evidence prohibits accept",
]'''
applies_to = ["agents-guidance", "claude-guidance"]

# Why Not: keep the plan-verification default as one coherent Data; splitting could permit EVAL corpus as a planning obligation while native verification remains present.
[contracts.repository-plan-verification-default-1cd0b7e4ffb5]
kind = "requires"
slice = "repository-plan-verification-default"
pattern = '''計画成果物の既定 verification は、この repository で実行できる native 手段に限り、EVAL を含めない。
Gunte が保証しない点は残存 risk / 未検証とし、受け入れを EVAL 実行に依存させない。
EVAL は Human が明示したとき、または既存 EVAL 成果物の変更自体が要求対象のときだけ使う。'''
applies_to = ["agents-guidance", "claude-guidance"]

[contracts.no-eval-as-default-llm-quality]
kind = "forbids"
pattern = "LLM の判断品質や読みやすさは EVAL または editorial review で扱います"
applies_to = ["agents-guidance", "claude-guidance"]

[contracts.no-evals-dir-as-inventory]
kind = "forbids"
pattern = "手動評価シナリオは `evals/` にあります"
applies_to = ["agents-guidance", "claude-guidance"]

