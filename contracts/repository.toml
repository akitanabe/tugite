# Why Not: target selection and Flow creation are separate witnesses; combining them would allow the Action owner to disappear from one side unnoticed.
[contracts.plan-artifact-publication-flow-temp-355e9219dea4]
kind = "requires"
slice = "plan-artifact-publication-flow"
pattern = "OS-temp では verified temp-root identity と top-level exact destination の root 直下 containment を再確認し、exact destination の directory を same-filesystem の secure / exclusive / non-follow で作成して、その object identity を記録する。"
applies_to = ["claude", "codex", "cursor"]

# Why Not: isolated write/readback/publish labels can pass after the ordered failure boundary is removed or moved outside this Flow.
[contracts.plan-artifact-publication-flow-write-readback-cd9b8e50ead3]
kind = "requires"
slice = "plan-artifact-publication-flow"
pattern = "staging を write して close し、同一 object の byte-identical readback を確認する。readback failure は `incomplete` として publish を行わず、complete のときだけ no-clobber publish を行い"
applies_to = ["claude", "codex", "cursor"]

# Why Not: selection must remain outside this Flow; a nearby ranking disclaimer can survive after the Flow itself starts re-selecting.
[contracts.plan-artifact-publication-flow-ba71e47c1560]
