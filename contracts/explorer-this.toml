[contracts.explorer-this-document]
kind = "occurrences"
pattern = "# explorer-this"
count = 1
paths = [
  "plugins/claude/skills/explorer-this/SKILL.md",
  "plugins/codex/skills/explorer-this/SKILL.md",
  "plugins/cursor/skills/explorer-this/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-agentic-first-adf2d805f723]
kind = "requires"
slice = "explorer-this-agentic-first"
pattern = "`explorer-this` は Agentic Model Construction を first route として利用し、Agentic が completion した場合は Human への局所確認を行わず、元の requested output へ直接接続します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-local-confirmation-2b33cc33c673]
kind = "requires"
slice = "explorer-this-local-confirmation"
pattern = '''Agentic の qualified stop 後も unresolved gap が material で、Human が解消できる fact / scope / authority である場合だけ、`explorer-this` が
caller-side で局所確認します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-nonhuman-stop-c50ef54e78f3]
kind = "requires"
slice = "explorer-this-nonhuman-stop"
pattern = "Human-owned の根拠がない factual uncertainty、取得不能 source、execution capability limitation、または単なる Agent の不確かさは Human の選択で埋めず、qualified stop を維持します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-continuity-ef0e680ceedd]
kind = "requires"
slice = "explorer-this-continuity"
pattern = "局所確認の response は同じ task-local Local Model へ Reintegration し、取得済み evidence、current semantics、qualification を継続します。non-material な場合は必要な local repair / re-observation を行い、material な invalidation 時だけ affected region を Recomposition して bounded に再観測します。second Local Model、serialized handoff、再構築を追加しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-authority-79656a944b4b]
kind = "requires"
slice = "explorer-this-authority"
pattern = "Method の選択・切り替え・composition は `explorer-this` calling workflow が所有し、`how-it` を nested invocation せず、局所確認を理由に task scope や write authority を拡張したり、autonomous remediation / unrelated write を開始したりしません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-output-95f771f10ba2]
kind = "requires"
slice = "explorer-this-output"
pattern = "`explorer-this` は局所確認の後も current understanding と retained qualification を元の requested output へ接続し、明示された destination / write authority を維持します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-human-facing-3e066957af5d]
kind = "requires"
slice = "explorer-this-human-facing-projection"
pattern = '''current understanding、fact / inference / uncertainty、根拠、retained qualification と requested output の内容・構成・tone を確定した後、返却または明示された destination への artifact write の前に、`../../references/human-facing-projection.md` の Final output boundary に従って requested output candidate に含まれる Human 向け prose 全体へ適用します。探索結果の事実、推論、不確実性、根拠、qualification、requested output の意味と、invocation 時点の destination / write authority は `explorer-this` が保持します。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-human-facing-projection-647875c62900]
kind = "requires"
slice = "explorer-this-human-facing-projection-verification"
pattern = "共通の Final output boundary に従う requested output の出力前確認では、current understanding、evidence、qualification、出力用途を保ち、探索範囲、task scope、write authority、completion または qualified stop を変更しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.explorer-this-document-before-agentic]
kind = "order"
before = "explorer-this-document-relation"
after = "explorer-this-agentic-first-relation"
applies_to = ["claude", "codex", "cursor"]

