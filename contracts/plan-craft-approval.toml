slice = "plan-craft-approval-handoff"
pattern = "ただし goal に対応する別 reviewer があれば `review-loop` へ渡す"
applies_to = ["claude", "codex"]

[contracts.plan-craft-approval-final-acceptance-requires-fc69834046e6]
kind = "requires"
slice = "plan-craft-approval-handoff"
pattern = "final acceptance は direction freeze と分離し、既定で必須とする。人間が明示的に opt-out した場合だけ承認 Action を\n省略できるが、final report は省略しない。"
applies_to = ["claude", "codex"]

[contracts.plan-craft-approval-deltas-requires-31dac0e0463a]
kind = "requires"
slice = "plan-craft-approval-handoff"
pattern = "親は全文精読を要求せず、方向変更の有無を明記した `Semantic Delta`、追加・変更した\n検証とその結果を示す `Verification Delta`、残存 risk を提示する。Verification Delta は特に境界、異常・failure path、\n壊れやすい既存挙動、禁止副作用、責務境界を優先し、成果物全文は人間が要求した場合だけ提示する。"
applies_to = ["claude", "codex"]

[contracts.plan-craft-approval-review-change-boundary-requires-6ace3cd5bf9a]
kind = "requires"
slice = "plan-craft-approval-handoff"
pattern = "review は frozen decisions を守る限り、実装の具体化、verification の補強、複雑性の削減を行える。frozen decision の\n変更が必要なら、改善案を採用せず `人間確認` へ止める。"
applies_to = ["claude", "codex"]

[contracts.plan-craft-approval-reopen-requires-b9e78802d407]
kind = "requires"
slice = "plan-craft-approval-handoff"
pattern = "final acceptance での修正要求は正常な結果として扱う。親は変更の影響と依存する判断だけを新しい `proposal-dialogue` loop で\n局所 reopen し、decision ledger 全体をリセットしない。再 review は変更箇所と直接・間接の波及へ限定し、無関係な領域へ\n探索を広げない。大きな purpose または scope の変更なら局所 reopen を行わず、public workflow 全体を再策定する。"
applies_to = ["claude", "codex"]

