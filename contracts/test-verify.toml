pattern = "要求の意味範囲と対象 test membership を同じものと扱わず、scope 内の候補構成根拠と未解決の要求を task-local Local Model に保持する。関連要求の意味を調べても実行・修正範囲を拡張しない。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-verify-topology-requirement-input-8b1b789e0500]
