slice = "test-verify-topology-requirement-input"
pattern = "要求から構成した Behavior candidate とその grounding / 未解決を Topology input として渡し、要求探索や対象範囲の解決を Topology / BMO に移さない。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-verify-bidirectional-reconciliation-74226d662dc5]
