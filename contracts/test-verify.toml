slice = "test-verify-bidirectional-reconciliation"
pattern = "Topology が返した各 Expected Observation を取得した Case / Evidence と照合し、同時に bounded scope で取得した各 Case / Evidence を要求から導出した Behavior / Expected Observation へ逆照合する。missing condition、成立・違反を区別できない Evidence、要求にない制約や誤った期待、correspondence / grounding / execution / observed-scope の限界を区別して Local Model に保持する。"
applies_to = ["claude", "codex", "cursor"]

[contracts.test-verify-requirement-completion-ab4127ee6690]
