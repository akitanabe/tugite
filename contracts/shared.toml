[contracts.shared-research-codex-invocation-30b3f1cfa6a9]
kind = "requires"
slice = "shared-research-platform-invocation"
pattern = '''`research-agent` を named subagent として `fork_turns = "none"` で起動し、delegation input と authority を渡す。'''
applies_to = ["codex"]

[contracts.shared-research-cursor-invocation-7566fd1678c3]
kind = "requires"
slice = "shared-research-platform-invocation"
pattern = "Cursor Agent の named subagent を `/research-agent` として起動し、delegation input と authority を渡す。"
applies_to = ["cursor"]

[contracts.shared-research-delegation-input-e2374d0662f2]
kind = "requires"
slice = "shared-research-delegation-input"
pattern = '''- **objective**: 何を知るための bounded evidence acquisition / exploration か
- **scope**: 探索できる source、repository、context、target boundary
- **authority**: 実行可能な observation-oriented Action とその上限
- **relevant context / evidence surface**: objective に関係する既知情報と接触可能な evidence surface'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-exact-authority-0236f3c4c428]
kind = "requires"
slice = "shared-research-exact-authority"
pattern = '''persistent / shared / destructive operation は evidence acquisition に不可欠で、caller が exact authority を明示した場合だけ許可する。
authority は operation、target、最大試行回数、retry condition を特定し、利用可能な場合は idempotency key / precondition も含める。
この authority は implementation、remediation、成果物変更、公開の ownership を与えない。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-retry-authority-83c8f257aaa1]
kind = "requires"
slice = "shared-research-retry-authority"
pattern = '''caller は authority にない retry を許可しない。partial / unknown result は success として扱わず、実行回数、観測できた状態、
limitation / unresolved point を保持する。再実行には新しい明示 authority を必要とする。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-cleanup-result-543508a0bf22]
kind = "requires"
slice = "shared-research-cleanup-result"
pattern = '''Research Agent が作る temporary resource は objective の観測に必要な isolated target に限定する。success / failure のいずれでも
可能な範囲で cleanup し、cleanup failure、residual state、状態不明は target とともに result に保持する。既存または共有 target を
temporary resource として扱わない。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-result-usability-ff29d4676985]
kind = "requires"
slice = "shared-research-result-usability"
pattern = '''caller は result の evidence / authority relation と task-relative semantic effect を判断する。partial / unknown result や limitation を
plausible inference で埋めず、利用できる evidence と未解決事項を区別する。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-result-data-c04d57d8de32]
