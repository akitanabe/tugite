applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-claude-invocation-3727af62b959]
kind = "requires"
slice = "shared-research-platform-invocation"
pattern = "`research-agent` を named subagent として起動し、delegation input と authority を渡す。"
