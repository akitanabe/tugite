applies_to = ["claude", "codex", "cursor"]

[contracts.shared-research-unavailable-577b8d84cb2e]
kind = "requires"
slice = "shared-research-invocation-unavailable"
pattern = '''named agent identity の解決は invocation の成立条件である。解決できない場合、caller は `Research Agent unavailable` と
