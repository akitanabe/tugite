Collective Sufficiency、Relevant Unresolved Viewpoints、uncovered semantics を consumer Data に保持する。'''
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-verification-topology-bmo-partial-boundary-2e0141c642dc]
