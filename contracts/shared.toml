[contracts.shared-verification-topology-precedence-limit-a416d4f9df9d]
kind = "requires"
slice = "shared-verification-topology-precedence-limit"
pattern = "未解決の precedence が Behavior または Expected Observation を変え得る場合は silent merge や任意選択をせず、affected correspondence と grounding limitation を保持する。"
applies_to = ["claude", "codex", "cursor"]

[contracts.shared-verification-topology-test-only-limit-aefaaacf1362]
kind = "requires"
slice = "shared-verification-topology-test-only-limit"
