[contracts.plan-agent-document]
kind = "occurrences"
pattern = "# plan-agent"
count = 1
paths = [
  "plugins/claude/skills/plan-agent/SKILL.md",
  "plugins/codex/skills/plan-agent/SKILL.md",
  "plugins/cursor/skills/plan-agent/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-responsibility-8a968afcc985]
kind = "requires"
slice = "plan-agent-responsibility"
pattern = "normal context から request-relative な自由形式の planning / design artifact を recommendation-first で作る"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-ownership-4f1870ace344]
kind = "requires"
slice = "plan-agent-ownership"
pattern = "exactly one の task-local Local Model を所有"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-core-input-1b0812bae186]
kind = "requires"
slice = "plan-agent-core-input"
pattern = "review applicability と explicit opt-out は `plan-agent` が判断します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-result-3825e66f8677]
kind = "requires"
slice = "plan-agent-gap-result"
pattern = "Human へ質問せず別 workflow も起動せず、unresolved gap を持つ `incomplete` を返します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-retry-13fc32e444dc]
kind = "requires"
slice = "plan-agent-gap-retry"
pattern = "更新済み projection / evidence で Planning Core を再実行し、Planning Synthesis の再実行と後続 routing は Planning Core に残します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-result-285f7f97afa5]
kind = "requires"
slice = "plan-agent-result"
pattern = "Planning Core の `final-candidate` または `incomplete` を変更せず受け取り"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-publication-7c08ddfde27c]
kind = "requires"
slice = "plan-agent-publication"
pattern = "frozen bytes を exclusive create した self-owned file へ書き、close 後に read-back して byte equality を確認した場合だけ publication success とします。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-plan-only-4a1cfc3e08d3]
kind = "requires"
slice = "plan-agent-plan-only"
pattern = "implementation、delegation、Issue / PR 更新、downstream workflow を開始しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-document-before-responsibility]
kind = "order"
before = "plan-agent-document-relation"
after = "plan-agent-responsibility-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-responsibility-before-ownership]
kind = "order"
before = "plan-agent-responsibility-relation"
after = "plan-agent-ownership-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-ownership-before-core]
