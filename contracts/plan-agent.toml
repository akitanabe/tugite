[contracts.plan-agent-document]
kind = "occurrences"
pattern = "# plan-agent"
count = 1
paths = [
  "plugins/claude/skills/plan-agent/SKILL.md",
  "plugins/codex/skills/plan-agent/SKILL.md",
  "plugins/cursor/skills/plan-agent/SKILL.md",
]
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-responsibility-8a968afcc985]
kind = "requires"
slice = "plan-agent-responsibility"
pattern = "normal context から request-relative な自由形式の planning / design artifact を recommendation-first で作る"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-ownership-4f1870ace344]
kind = "requires"
slice = "plan-agent-ownership"
pattern = "exactly one の task-local Local Model を所有"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-core-input-1b0812bae186]
kind = "requires"
slice = "plan-agent-core-input"
pattern = "review applicability と explicit opt-out は `plan-agent` が判断します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-advisor-5e1a87502d81]
kind = "requires"
slice = "plan-agent-advisor-applicability"
pattern = "実現方法に material な判断がある Plan は advisor applicable とし、単純な機械変更または実現方法がほぼ一意な場合だけ nonapplicable とします。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-advisor-a3519ad02276]
kind = "requires"
slice = "plan-agent-advisor-input"
pattern = "advisor applicability とその理由、current Local Model projection、established direction、authority constraints、resolved evidence、invocation-local advisor state を Planning Core へ渡します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-advisor-7369cf81db48]
kind = "requires"
slice = "plan-agent-advisor-invocation"
pattern = "top-level invocation の開始時に advisor state を未実施として初期化し、その state を reset せず保持します。Synthesis が適用性と candidate coherence に基づいて実施した result / state を Planning Core の再入でも同じ invocation で受け取ります。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-advisor-3b3f5045e5a1]
kind = "requires"
slice = "plan-agent-advisor-failure"
pattern = "applicable な advisor の unavailable または invocation failure は skip、別 agent、呼び直しで bypass せず `incomplete` にします。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-result-3825e66f8677]
kind = "requires"
slice = "plan-agent-gap-result"
pattern = "Human へ質問せず別 workflow も起動せず、unresolved gap を持つ `incomplete` を返します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-retry-13fc32e444dc]
kind = "requires"
slice = "plan-agent-gap-retry"
pattern = "更新済み projection / evidence で Planning Core を再実行し、Planning Synthesis の再実行と後続 routing は Planning Core に残します。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-result-285f7f97afa5]
kind = "requires"
slice = "plan-agent-result"
pattern = "Planning Core の `final-candidate` または `incomplete` を変更せず受け取り"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-publication-7c08ddfde27c]
kind = "requires"
slice = "plan-agent-publication"
pattern = "frozen bytes を exclusive create した self-owned file へ書き、close 後に read-back して byte equality を確認した場合だけ publication success とします。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-plan-only-4a1cfc3e08d3]
kind = "requires"
slice = "plan-agent-plan-only"
pattern = "implementation、delegation、Issue / PR 更新、downstream workflow を開始しません。"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-document-before-responsibility]
kind = "order"
before = "plan-agent-document-relation"
after = "plan-agent-responsibility-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-responsibility-before-ownership]
kind = "order"
before = "plan-agent-responsibility-relation"
after = "plan-agent-ownership-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-ownership-before-core]
kind = "order"
before = "plan-agent-ownership-relation"
after = "plan-agent-core-input-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-core-before-gap]
kind = "order"
before = "plan-agent-core-input-relation"
after = "plan-agent-gap-retry-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-retry-before-result]
kind = "order"
before = "plan-agent-gap-retry-relation"
after = "plan-agent-gap-result-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-gap-before-result]
kind = "order"
before = "plan-agent-gap-result-relation"
after = "plan-agent-result-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-result-before-completion]
kind = "order"
before = "plan-agent-result-relation"
after = "plan-agent-plan-only-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-result-before-publication]
kind = "order"
before = "plan-agent-result-relation"
after = "plan-agent-publication-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-publication-before-completion]
kind = "order"
before = "plan-agent-publication-relation"
after = "plan-agent-plan-only-relation"
applies_to = ["claude", "codex", "cursor"]

[contracts.plan-agent-claude-invocation-policy]
kind = "occurrences"
pattern = "disable-model-invocation: true"
count = 1
paths = ["plugins/claude/skills/plan-agent/SKILL.md"]
applies_to = ["claude"]

[contracts.plan-agent-codex-invocation-policy]
kind = "occurrences"
pattern = "allow_implicit_invocation: false"
count = 1
paths = ["plugins/codex/skills/plan-agent/agents/openai.yaml"]
applies_to = ["codex"]

[contracts.plan-agent-cursor-invocation-policy]
