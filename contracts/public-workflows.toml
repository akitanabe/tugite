[contracts.explain-this-document]
kind = "occurrences"
pattern = "# explain-this"
count = 1
paths = ["plugins/claude/skills/explain-this/SKILL.md", "plugins/codex/skills/explain-this/SKILL.md", "plugins/cursor/skills/explain-this/SKILL.md"]
applies_to = ["claude", "codex", "cursor"]

[contracts.explain-this-explicit-invocation]
kind = "structure"
subject = "artifact"
paths = ["plugins/claude/skills/explain-this/SKILL.md", "plugins/cursor/skills/explain-this/SKILL.md"]
format = "yaml"
applies_to = ["claude", "cursor"]
assertions = [
  { path = "name", op = "equals", value = "explain-this" },
  { path = "disable-model-invocation", op = "equals", value = true },
]

[contracts.explain-this-codex-invocation]
kind = "structure"
subject = "artifact"
paths = ["plugins/codex/skills/explain-this/agents/openai.yaml"]
format = "yaml"
applies_to = ["codex"]
assertions = [
  { path = "policy.allow_implicit_invocation", op = "equals", value = false },
]

