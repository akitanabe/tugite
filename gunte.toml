spec_version = 1

[project]
id = "tugite"
version = "5.1.0"

[sources]
files = [
  "shared/agents/focused-implementer.md",
  "shared/agents/expert-implementer.md",
  "shared/agents/implementer.md",
  "shared/agents/over-engineering-reviewer.md",
  "shared/agents/plan-adversarial-reviewer.md",
  "shared/agents/plan-quality-advisor.md",
  "shared/agents/responsibility-boundary-reviewer.md",
  "shared/agents/security-side-effect-reviewer.md",
  "shared/agents/senior-implementer.md",
  "shared/agents/test-quality-reviewer.md",
  "shared/agents/writing-principles-reviewer.md",
  "shared/skill/impl-lead/SKILL.md",
  "shared/skill/plan-craft/SKILL.md",
  "shared/skill/proposal/SKILL.md",
  "shared/skill/review-loop/SKILL.md",
  "shared/skill/work-unit-design/SKILL.md",
  "declarations/claude/plugin.json",
  "declarations/codex/plugin.json",
  "declarations/codex/skills/impl-lead/openai.yaml",
  "declarations/codex/skills/plan-craft/openai.yaml",
  "declarations/codex/skills/proposal/openai.yaml",
  "declarations/codex/skills/review-loop/openai.yaml",
  "declarations/codex/skills/work-unit-design/openai.yaml",
  "shared/VERSION",
]

[terms.parent_agent]
claude = "親エージェント"
codex = "親 Codex エージェント"

[terms.reviewer_invocation]
claude = "新規 Agent"
codex = "新しい reviewer worker"

[terms.new_worker_invocation]
claude = "新規の `Agent` 呼び出し"
codex = "新しい worker の起動"

[terms.new_worker]
claude = "新規 `Agent`"
codex = "新しい worker"

[terms.continuation_mechanism]
claude = "`SendMessage`"
codex = "`followup_task`"

[targets.claude]
output_root = "plugins/claude"

[[targets.claude.rules]]
match = "shared/agents/*.md"
path = "agents/{1}.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:claude.description", type = "string" },
  { field = "model", from = "frontmatter:claude.model", type = "plain_token" },
  { field = "effort", from = "frontmatter:claude.effort", type = "plain_token" },
  { field = "tools", from = "frontmatter:claude.tools", type = "comma_list", required = false },
  { field = "disallowedTools", from = "frontmatter:claude.disallowed_tools", type = "comma_list", required = false },
]

[[targets.claude.rules]]
match = "shared/skill/*/SKILL.md"
path = "skills/{1}/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "declarations/claude/plugin.json"
path = ".claude-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

[targets.codex]
output_root = "plugins/codex"

[[targets.codex.rules]]
match = "shared/agents/*.md"
path = "install/agents/{1}.toml"
profile = "toml-v1"
header = "Generated from shared/. Do not edit directly."
body_field = "developer_instructions"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:codex.description", type = "string" },
  { field = "model", from = "frontmatter:codex.model", type = "string" },
  { field = "model_reasoning_effort", from = "frontmatter:codex.model_reasoning_effort", type = "string" },
  { field = "sandbox_mode", from = "frontmatter:codex.sandbox_mode", type = "string", required = false },
  { field = "nickname_candidates", from = "frontmatter:codex.nickname_candidates", type = "string_list" },
]

[[targets.codex.rules]]
match = "shared/skill/*/SKILL.md"
path = "skills/{1}/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "declarations/codex/skills/*/openai.yaml"
path = "skills/{1}/agents/openai.yaml"
profile = "markdown-v1"

[[targets.codex.rules]]
match = "declarations/codex/plugin.json"
path = ".codex-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

[[targets.codex.rules]]
match = "shared/VERSION"
path = "install/VERSION"
profile = "plain-text-v1"
value_from = "project:version"
