spec_version = 2

[project]
id = "tugite"
version_from = "shared/VERSION"

[contracts]
files = [
  "contracts/repository.toml",
  "contracts/clarify-it.toml",
  "contracts/workers.toml",
  "contracts/impl-lead.toml",
  "contracts/plan-agent.toml",
  "contracts/plan-interactive.toml",
  "contracts/kernel.toml",
  "contracts/batch-resolve-kernel.toml",
  "contracts/necessity-kernel.toml",
  "contracts/resolve-kernel.toml",
  "contracts/writable-scope-kernel.toml",
]

[sources]
files = [
  "shared/agents/focused-implementer.md",
  "shared/agents/expert-implementer.md",
  "shared/agents/implementer.md",
  "shared/agents/over-engineering-reviewer.md",
  "shared/agents/plan-adversarial-reviewer.md",
  "shared/agents/plan-quality-advisor.md",
  "shared/agents/responsibility-boundary-reviewer.md",
  "shared/agents/security-side-effect-reviewer.md",
  "shared/agents/senior-implementer.md",
  "shared/agents/static-performance-reviewer.md",
  "shared/agents/test-quality-reviewer.md",
  "shared/agents/writing-principles-reviewer.md",
  "shared/batch-resolve-kernel.md",
  "shared/necessity-kernel.md",
  "shared/plan-artifact-publication.md",
  "shared/plan-artifact-design.md",
  "shared/resolve-kernel.md",
  "shared/writable-scope-kernel.md",
  "shared/skill/clarify-it/SKILL.md",
  "shared/skill/clarify-it/references/philosophy.md",
  "shared/skill/code-review/SKILL.md",
  "shared/skill/impl-lead/SKILL.md",
  "shared/skill/impl-lead/references/final-writing-gate.md",
  "shared/skill/impl-lead/references/run-owned-lifecycle.md",
  "shared/skill/plan-agent/SKILL.md",
  "shared/skill/plan-interactive/SKILL.md",
  "shared/skill/plan-candidate-producer/SKILL.md",
  "shared/skill/review-refine/SKILL.md",
  "shared/skill/structural-health-gate/SKILL.md",
  "shared/skill/work-unit-design/SKILL.md",
  "shared/repository-guidelines.md",
  "declarations/claude/plugin.json",
  "declarations/claude/marketplace.json",
  "declarations/codex/plugin.json",
  "declarations/codex/marketplace.json",
  "declarations/codex/skills/clarify-it/openai.yaml",
  "declarations/codex/skills/code-review/openai.yaml",
  "declarations/codex/skills/impl-lead/openai.yaml",
  "declarations/codex/skills/plan-agent/openai.yaml",
  "declarations/codex/skills/plan-interactive/openai.yaml",
  "declarations/codex/skills/plan-candidate-producer/openai.yaml",
  "declarations/codex/skills/review-refine/openai.yaml",
  "declarations/codex/skills/structural-health-gate/openai.yaml",
  "declarations/codex/skills/work-unit-design/openai.yaml",
  "declarations/cursor/plugin.json",
  "shared/VERSION",
  "README.md",
]
managed_roots = [
  "shared",
  "declarations",
  "contracts",
  "tests",
  "scripts",
  "contracts.toml",
  ".claude-plugin",
  ".agents/plugins",
]
allow_files = [
  "tests/install-agents-test.sh",
  "tests/install-cursor-plugin-test.sh",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
]

[terms.parent_agent]
claude = "親エージェント"
codex = "親 Codex エージェント"
cursor = "親 Cursor エージェント"
claude-marketplace = "親エージェント"
codex-marketplace = "親 Codex エージェント"
agents-guidance = "親 Codex エージェント"
claude-guidance = "親エージェント"

[terms.reviewer_invocation]
claude = "新規 Agent"
codex = "新しい reviewer worker"
cursor = "新しい reviewer subagent"
claude-marketplace = "新規 Agent"
codex-marketplace = "新しい reviewer worker"
agents-guidance = "新しい reviewer worker"
claude-guidance = "新規 Agent"

[terms.new_worker_invocation]
claude = "新規の `Agent` 呼び出し"
codex = "新しい worker の起動"
cursor = "新しい subagent の起動"
claude-marketplace = "新規の `Agent` 呼び出し"
codex-marketplace = "新しい worker の起動"
agents-guidance = "新しい worker の起動"
claude-guidance = "新規の `Agent` 呼び出し"

[terms.new_worker]
claude = "新規 `Agent`"
codex = "新しい worker"
cursor = "新しい subagent"
claude-marketplace = "新規 `Agent`"
codex-marketplace = "新しい worker"
agents-guidance = "新しい worker"
claude-guidance = "新規 `Agent`"

[terms.continuation_mechanism]
claude = "`SendMessage`"
codex = "`followup_task`"
cursor = "同じ subagent context の継続"
claude-marketplace = "`SendMessage`"
codex-marketplace = "`followup_task`"
agents-guidance = "`followup_task`"
claude-guidance = "`SendMessage`"

[targets.claude]
output_root = "plugins/claude"
managed_roots = ["agents", "skills", "references", ".claude-plugin"]

[[targets.claude.rules]]
match = "shared/batch-resolve-kernel.md"
path = "references/batch-resolve-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/necessity-kernel.md"
path = "references/necessity-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/plan-artifact-publication.md"
path = "references/plan-artifact-publication.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/plan-artifact-design.md"
path = "references/plan-artifact-design.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/resolve-kernel.md"
path = "references/resolve-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/writable-scope-kernel.md"
path = "references/writable-scope-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/agents/*.md"
path = "agents/{1}.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:claude.description", type = "string" },
  { field = "model", from = "frontmatter:claude.model", type = "plain_token" },
  { field = "effort", from = "frontmatter:claude.effort", type = "plain_token" },
  { field = "tools", from = "frontmatter:claude.tools", type = "comma_list", required = false },
  { field = "disallowedTools", from = "frontmatter:claude.disallowed_tools", type = "comma_list", required = false },
]

[[targets.claude.rules]]
match = "shared/skill/*/SKILL.md"
path = "skills/{1}/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/skill/clarify-it/references/philosophy.md"
path = "skills/clarify-it/references/philosophy.md"
profile = "markdown-v1"

[[targets.claude.rules]]
match = "shared/skill/impl-lead/references/*.md"
path = "skills/impl-lead/references/{1}.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "declarations/claude/plugin.json"
path = ".claude-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

[targets.codex]
output_root = "plugins/codex"
managed_roots = ["install", "skills", "references", ".codex-plugin"]
allow_files = ["install/install-agents.sh"]
allow_dirs = ["skills/install-custom-agents"]

[[targets.codex.rules]]
match = "shared/batch-resolve-kernel.md"
path = "references/batch-resolve-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/necessity-kernel.md"
path = "references/necessity-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/plan-artifact-publication.md"
path = "references/plan-artifact-publication.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/plan-artifact-design.md"
path = "references/plan-artifact-design.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/resolve-kernel.md"
path = "references/resolve-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/writable-scope-kernel.md"
path = "references/writable-scope-kernel.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/agents/*.md"
path = "install/agents/{1}.toml"
profile = "toml-v1"
header = "Generated from shared/. Do not edit directly."
body_field = "developer_instructions"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:codex.description", type = "string" },
  { field = "model", from = "frontmatter:codex.model", type = "string" },
  { field = "model_reasoning_effort", from = "frontmatter:codex.model_reasoning_effort", type = "string" },
  { field = "sandbox_mode", from = "frontmatter:codex.sandbox_mode", type = "string", required = false },
  { field = "nickname_candidates", from = "frontmatter:codex.nickname_candidates", type = "string_list" },
]

[[targets.codex.rules]]
match = "shared/skill/*/SKILL.md"
path = "skills/{1}/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/skill/clarify-it/references/philosophy.md"
path = "skills/clarify-it/references/philosophy.md"
profile = "markdown-v1"

[[targets.codex.rules]]
match = "shared/skill/impl-lead/references/*.md"
path = "skills/impl-lead/references/{1}.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "declarations/codex/skills/*/openai.yaml"
path = "skills/{1}/agents/openai.yaml"
profile = "markdown-v1"

[[targets.codex.rules]]
match = "declarations/codex/plugin.json"
path = ".codex-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

[[targets.codex.rules]]
match = "shared/VERSION"
path = "install/VERSION"
profile = "plain-text-v1"
value_from = "project:version"

[targets.cursor]
output_root = "plugins/cursor"
managed_roots = ["install", "agents", "skills", "references", ".cursor-plugin"]
allow_files = [
  "install/install-plugin.sh",
  "install/install-plugin.ps1",
]
allow_dirs = ["skills/install-plugin"]


[[targets.cursor.rules]]
