spec_version = 2

[project]
id = "tugite"
version_from = "shared/VERSION"

[contracts]
files = ["contracts/shared.toml"]

[sources]
files = [
  "shared/VERSION",
  "shared/model-construction.md",
  "shared/agentic-model-construction.md",
  "shared/interactive-model-construction.md",
  "shared/behavior-model-observation.md",
  "shared/reality-model-observation.md",
  "shared/research-agent-delegation.md",
  "shared/agents/research-agent.md",
  "shared/skill/explorer-this/SKILL.md",
  "declarations/claude/plugin.json",
  "declarations/claude/marketplace.json",
  "declarations/codex/plugin.json",
  "declarations/codex/marketplace.json",
  "declarations/codex/skills/code-review/openai.yaml",
  "declarations/codex/skills/explorer-this/openai.yaml",
  "declarations/codex/skills/impl-lead/openai.yaml",
  "declarations/codex/skills/plan-agent/openai.yaml",
  "declarations/codex/skills/plan-interactive/openai.yaml",
  "declarations/codex/skills/plan-candidate-producer/openai.yaml",
  "declarations/codex/skills/review-refine/openai.yaml",
  "declarations/codex/skills/structural-health-gate/openai.yaml",
  "declarations/codex/skills/test-report/openai.yaml",
  "declarations/codex/skills/implementation-unit-design/openai.yaml",
  "declarations/cursor/plugin.json",
]
managed_roots = ["shared", "contracts", "declarations"]
allow_files = [
  "shared/README.md",
]

# Why Not: v7 は canonical shared/ を選択的に再構築中のため、旧 v6 plugin の未再構築ファイルを managed inventory に含めない。
[targets.claude]
output_root = "plugins/claude"

[[targets.claude.rules]]
match = "shared/model-construction.md"
path = "references/model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/agentic-model-construction.md"
path = "references/agentic-model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/interactive-model-construction.md"
path = "references/interactive-model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/behavior-model-observation.md"
path = "references/behavior-model-observation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/reality-model-observation.md"
path = "references/reality-model-observation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/research-agent-delegation.md"
path = "references/research-agent-delegation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "shared/agents/*.md"
path = "agents/{1}.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:claude.description", type = "string" },
  { field = "model", from = "frontmatter:claude.model", type = "plain_token" },
  { field = "effort", from = "frontmatter:claude.effort", type = "plain_token" },
  { field = "tools", from = "frontmatter:claude.tools", type = "comma_list", required = false },
  { field = "disallowedTools", from = "frontmatter:claude.disallowed_tools", type = "comma_list", required = false },
]

[[targets.claude.rules]]
match = "shared/skill/explorer-this/SKILL.md"
path = "skills/explorer-this/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.claude.rules]]
match = "declarations/claude/plugin.json"
path = ".claude-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

[targets.codex]
output_root = "plugins/codex"

[[targets.codex.rules]]
match = "shared/model-construction.md"
path = "references/model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/agentic-model-construction.md"
path = "references/agentic-model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/interactive-model-construction.md"
path = "references/interactive-model-construction.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/behavior-model-observation.md"
path = "references/behavior-model-observation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/reality-model-observation.md"
path = "references/reality-model-observation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/research-agent-delegation.md"
path = "references/research-agent-delegation.md"
profile = "markdown-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/agents/*.md"
path = "install/agents/{1}.toml"
profile = "toml-v1"
header = "Generated from shared/. Do not edit directly."
body_field = "developer_instructions"
metadata = [
  { field = "name", from = "core:name", type = "string" },
  { field = "description", from = "frontmatter:codex.description", type = "string" },
  { field = "model", from = "frontmatter:codex.model", type = "string" },
  { field = "model_reasoning_effort", from = "frontmatter:codex.model_reasoning_effort", type = "string" },
  { field = "sandbox_mode", from = "frontmatter:codex.sandbox_mode", type = "string", required = false },
  { field = "nickname_candidates", from = "frontmatter:codex.nickname_candidates", type = "string_list" },
]

[[targets.codex.rules]]
match = "shared/skill/explorer-this/SKILL.md"
path = "skills/explorer-this/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

[[targets.codex.rules]]
match = "shared/VERSION"
path = "install/VERSION"
profile = "plain-text-v1"
value_from = "project:version"

[[targets.codex.rules]]
match = "declarations/codex/skills/*/openai.yaml"
path = "skills/{1}/agents/openai.yaml"
profile = "markdown-v1"

[[targets.codex.rules]]
match = "declarations/codex/plugin.json"
path = ".codex-plugin/plugin.json"
profile = "json-v1"
metadata = [
  { field = "version", from = "project:version", type = "string" },
]

