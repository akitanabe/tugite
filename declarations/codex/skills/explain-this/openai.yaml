interface:
  display_name: "Explain This"
  short_description: "Explain feature flow and actual code execution"
  default_prompt: "Use $explain-this only when explicitly requested. Start with the feature overview and semantic processing flow, trace the actual code execution path, and explain code-grounded meaning, conditions, and effects for meaningful processing units, including mixed responsibilities. Distinguish runtime observations, intent, test expectations, and unknowns; stop after the explanation."
policy:
  allow_implicit_invocation: false
