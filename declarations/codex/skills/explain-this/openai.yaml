interface:
  display_name: "Explain This"
  short_description: "Explain implementation flow with grounded limits"
  default_prompt: "Use $explain-this only when explicitly requested. Return an overview flow within the requested start and end points: put each selected major implementation identifier first, then briefly state its role and transition. Use code as evidence, keeping investigation and internal procedures out of the default output. Add only qualifications needed to follow a handoff or commitment, or explicitly requested detail, then stop."
policy:
  allow_implicit_invocation: false
